[workspace]
resolver = "3"
members = [
    "crates/grebe-syntax",
    "crates/grebe-rules",
    "crates/grebe-format",
    "crates/grebe-cli",
    "crates/grebe-lsp",
]

[workspace.package]
# One version for the workspace and the VS Code client alike; the release tag
# (`v0.2.0`) is the same number. `grebe --version` reports it.
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ncrzw9/grebe"
keywords = ["duckdb", "sql", "formatter", "linter"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]

[workspace.dependencies]
grebe-syntax = { path = "crates/grebe-syntax", version = "0.4.0" }
grebe-rules = { path = "crates/grebe-rules", version = "0.4.0" }
grebe-format = { path = "crates/grebe-format", version = "0.4.0" }
grebe-lsp = { path = "crates/grebe-lsp", version = "0.4.0" }

[workspace.lints.rust]
unsafe_code = "forbid"          # safe Rust only

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
