name: History cleanup
run-name: History cleanup (${{ inputs.mode }})

# One-off, run by hand. After main was rewritten to remove private data from
# commit messages, four release tags and nine merged branches still pointed
# at the old commits. This moves the tags to the rewritten commits and
# deletes the branches, so nothing in the repository refers to the old
# history any more. File contents are identical on both sides; every step
# checks that before it changes anything, and stops if a check fails.
#
# Tags pushed with the workflow's own token start no other workflow, so the
# Release workflow does not run for them. Delete this file once it has run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check: only report what would change. apply: do it."
        type: choice
        options: [check, apply]
        default: check

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move the release tags to the rewritten commits
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch --quiet --force origin '+refs/tags/*:refs/tags/*' '+refs/heads/main:refs/remotes/origin/main'
          git config user.name "ncrzw9"
          git config user.email "24656957+ncrzw9@users.noreply.github.com"
          # tag, the commit it pointed at, the same commit in the rewritten history
          while read -r tag old new; do
            now=$(git rev-parse "$tag^{commit}")
            if [ "$now" = "$new" ]; then
              echo "$tag: already on the rewritten commit"
              continue
            fi
            if [ "$now" != "$old" ]; then
              echo "::error::$tag points at $now, which is neither the old nor the rewritten commit" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$new" origin/main; then
              echo "::error::$new is not on main" >&2
              exit 1
            fi
            if [ "$(git rev-parse "$old^{tree}")" != "$(git rev-parse "$new^{tree}")" ]; then
              echo "::error::$tag: the rewritten commit's files differ from the old one's" >&2
              exit 1
            fi
            echo "$tag: $old -> $new (same files)"
            if [ "$MODE" = "apply" ]; then
              # The tag keeps its message and its date.
              message=$(git for-each-ref --format='%(contents)' "refs/tags/$tag")
              when=$(git for-each-ref --format='%(taggerdate:raw)' "refs/tags/$tag")
              GIT_COMMITTER_DATE="$when" git tag -f -a "$tag" "$new" -m "$message"
              git push --force origin "refs/tags/$tag"
            fi
          done <<'TAGS'
          v0.6.1 7c77aa1da06960b4e554f5cef4baf8541a8eab51 8d5be3a0633843303891872b47da5571247277ea
          v0.6.2 48d46537aa27a1cc0c529106db68ffe8561fbb2b f799023f00fc9887c64c1989dc72ca6bfd577de0
          v0.6.3 b11587cb1d1bd1e7de3af46dc39480b733fcc1a1 e0854f8242f48b088ce10b7301613880c2fe1ac3
          v0.6.4 f53ccd27709b27a1567f55d1e4e620f2d9dde257 72f9a9dd7759597e2b5346fe521f60af71b8ec87
          TAGS

      - name: Delete the merged branches that hold the old commits
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # branch, and the commit it must still be at: a branch that has
          # moved since is someone's work and is left alone.
          while read -r branch tip; do
            now=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
            if [ -z "$now" ]; then
              echo "$branch: already deleted"
              continue
            fi
            if [ "$now" != "$tip" ]; then
              echo "::warning::$branch has moved to $now; not deleted"
              continue
            fi
            echo "$branch: delete ($tip)"
            if [ "$MODE" = "apply" ]; then
              git push origin --delete "refs/heads/$branch"
            fi
          done <<'BRANCHES'
          catalog-attach-postgres a3b35b7ba257c4eec1497d86412105eba349ffb9
          ccr-076cb9fb-m7qpsw 821076d97b8b62d0673617d5c842af555f8c4b36
          ci-browser-tests 3e2ef907fe8f700cbb7360191c09ea7f08121322
          lsp-0.6.4 0f656d3c4854a2c9ddd6d17cdc6f449b13b7b36e
          parser-memory ca634472a6b4073cf9c9fdc3760e9178c12e99e4
          release-0.6.2 d937e8653b7151a1c2b596275f131cefe6073412
          release-0.6.4 4e4d363eacd7f3a9bf18daab4095077cef1de3e0
          results-view-resync 1a71bb548cfd38596f13d0e44871649f62182c08
          session-stderr-race fd3497d067f6efd77a5007d4b1577489eddc92fa
          BRANCHES

      - name: What the repository refers to now
        run: |
          set -euo pipefail
          echo "branches:"; git ls-remote --heads origin | awk '{print "  " $2 " " $1}'
          echo "tags:"; git ls-remote --tags origin | awk '{print "  " $2 " " $1}'
