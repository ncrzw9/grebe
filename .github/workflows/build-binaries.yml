name: Build binaries
run-name: Build binaries${{ inputs.release && ' (release)' || '' }}

# The grebe binary for every platform a release ships, and the extension
# packages made from them.
#
# A release calls this workflow for its binaries. It also runs on its own,
# every week and whenever a workflow or a Cargo manifest changes, as a
# rehearsal: it builds every target and packages every .vsix, and publishes
# nothing. A runner image GitHub has retired, a target the toolchain no
# longer builds, or a packaging step that broke shows up here, on a quiet
# Monday, instead of halfway through a release after the tag is made.
on:
  workflow_call:
    inputs:
      release:
        description: "Called by the Release workflow, which packages and publishes itself."
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "editors/vscode/package.json"
      - "editors/vscode/package-targets.js"

permissions:
  contents: read

env:
  # The toolchain releases are built with. Keep in step with release.yml.
  RUST_VERSION: "1.98.0"
  BIN_NAME: grebe
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Runner labels are the moving `-latest` ones on purpose. A pinned
        # image is retired on GitHub's schedule (macos-14 went on 2 November
        # 2026 and cancelled a release's macOS builds), and nothing here
        # depends on the image's version: the binary is plain Rust, and the
        # toolchain is pinned above. The weekly run is what catches a
        # `-latest` that moved to something that no longer builds.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            aarch64_gnu: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ env.RUST_VERSION }} (target ${{ matrix.target }})
        shell: bash
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add ${{ matrix.target }}

      - name: Install musl cross tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install aarch64-linux-gnu cross tools
        if: matrix.aarch64_gnu
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu; then
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install gcc-aarch64-linux-gnu after 3 attempts" >&2
          exit 1

      - uses: actions/cache@v5
        with:
          path: target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      # A binary built for this runner's own architecture has to answer and
      # do its job. (The x86_64 macOS binary and the arm64 Linux one are
      # cross-built and cannot run here.)
      - name: The binary runs
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}"
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --version
          printf 'select 1;\n' | "$exe" format -

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ env.BIN_NAME }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$dir/"
          cp LICENSE README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "${{ env.BIN_NAME }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$dir/"
          Copy-Item LICENSE "$dir/"
          Copy-Item README.md "$dir/"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  # The rehearsal's second half: every .vsix a release would attach, built
  # from the binaries above and thrown away. A release does this itself, so
  # this job is skipped when the Release workflow is the caller.
  package:
    name: package the extension (rehearsal)
    if: ${{ inputs.release != true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Package every platform
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          node editors/vscode/build-grammar.js
          if ! git diff --quiet editors/vscode/syntaxes/; then
            echo "::error::editors/vscode/syntaxes/ is stale -- run 'node editors/vscode/build-grammar.js' and commit the result" >&2
            exit 1
          fi
          (cd editors/vscode && npm install --silent)
          node editors/vscode/package-targets.js out out
          ls -la out
          # One package per platform and the universal one.
          count=$(ls out/*.vsix | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "::error::expected 7 .vsix files, found $count" >&2
            exit 1
          fi
