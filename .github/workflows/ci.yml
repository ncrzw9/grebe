name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: target
          key: ci-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Against the grebe just built and a real DuckDB CLI, so running SQL,
      # the catalog and data files are tested end to end.
      - name: VS Code extension tests
        env:
          DUCKDB_VERSION: "1.5.5"
        run: |
          set -euo pipefail
          cargo build --bin grebe
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v$DUCKDB_VERSION/duckdb_cli-linux-amd64.zip"
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          GREBE_BIN="$PWD/target/debug/grebe" DUCKDB_CLI="$RUNNER_TEMP/duckdb/duckdb" \
            node --test editors/vscode/test/*.test.js
      # Verification builds sibling crates as registry dependencies, and cargo
      # never rebuilds a registry crate it has already compiled at the same
      # version. Every crate here keeps one version across many commits, so a
      # cached target/ would verify against an older sibling's build.
      - run: cargo package --workspace --target-dir "$RUNNER_TEMP/package"
