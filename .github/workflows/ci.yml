name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: target
          key: ci-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: VS Code extension tests, against the grebe just built
        run: |
          cargo build --bin grebe
          GREBE_BIN="$PWD/target/debug/grebe" node --test editors/vscode/test/*.test.js
      # Verification builds sibling crates as registry dependencies, and cargo
      # never rebuilds a registry crate it has already compiled at the same
      # version. Every crate here keeps one version across many commits, so a
      # cached target/ would verify against an older sibling's build.
      - run: cargo package --workspace --target-dir "$RUNNER_TEMP/package"
