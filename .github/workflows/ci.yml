name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          # target/package is excluded: cargo package --workspace regenerates
          # it from scratch every run by design (it verifies this run's own
          # source), and every crate here stays at the same version release
          # after release, so a cached copy from an older commit never looks
          # stale enough to invalidate on its own.
          path: |
            target
            !target/package
          # v2: the key bump forces a clean save once, discarding any
          # earlier cache entry that was saved with target/package still in
          # it (from before that path was excluded above).
          key: ci-v2-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo package --workspace
