name: Release
run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

# Two ways in: push a v* tag, or run this workflow by hand with the version,
# in which case it tags the commit itself once the checks pass. Either way
# nothing is published until the release environment is approved.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.4.2)"
        required: true

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  BIN_NAME: grebe
  CARGO_TERM_COLOR: always

jobs:
  # A tag ships only if it names the version every manifest declares and the
  # tree passes the same checks as CI.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt,clippy && rustup default ${{ env.RUST_VERSION }}
      - name: Tag matches Cargo.toml and package.json
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then tag="v$INPUT_VERSION"; else tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "grebe") | .version')
          vscode_version=$(jq -r .version editors/vscode/package.json)
          echo "tag=$tag cargo=$cargo_version vscode=$vscode_version"
          [ "$version" = "$cargo_version" ] && [ "$version" = "$vscode_version" ]
          if [ -n "$INPUT_VERSION" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Against the grebe just built and a real DuckDB CLI, so running SQL,
      # the catalog and data files are tested end to end.
      - name: VS Code extension tests
        env:
          DUCKDB_VERSION: "1.5.5"
        run: |
          set -euo pipefail
          cargo build --bin grebe
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v$DUCKDB_VERSION/duckdb_cli-linux-amd64.zip"
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          GREBE_BIN="$PWD/target/debug/grebe" DUCKDB_CLI="$RUNNER_TEMP/duckdb/duckdb" \
            node --test editors/vscode/test/*.test.js
      - run: cargo package --workspace
      # A tag pushed with the workflow's own token starts no new run, so this
      # run carries on as the release for it.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "grebe ${TAG#v}" "$GITHUB_SHA"
          git push origin "$TAG"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            aarch64_gnu: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }} (target ${{ matrix.target }})
        shell: bash
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add ${{ matrix.target }}

      - name: Install musl cross tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install aarch64-linux-gnu cross tools
        if: matrix.aarch64_gnu
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu; then
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install gcc-aarch64-linux-gnu after 3 attempts" >&2
          exit 1

      - uses: actions/cache@v4
        with:
          path: target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ env.BIN_NAME }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$dir/"
          cp LICENSE README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "${{ env.BIN_NAME }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$dir/"
          Copy-Item LICENSE "$dir/"
          Copy-Item README.md "$dir/"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    name: publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect the archives
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;

      # One .vsix per platform with that platform's grebe inside, plus a
      # universal one without a binary for every other platform.
      - name: Package the VS Code extension
        run: |
          set -euo pipefail
          node editors/vscode/build-grammar.js
          if ! git diff --quiet editors/vscode/syntaxes/; then
            echo "::error::editors/vscode/syntaxes/ is stale -- run 'node editors/vscode/build-grammar.js' and commit the result" >&2
            exit 1
          fi
          (cd editors/vscode && npm install --silent)
          node editors/vscode/package-targets.js out out
          ( cd out && sha256sum * > SHA256SUMS.txt )
          ls -la out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/* --verify-tag --title "$TAG" --generate-notes

  # Publishing waits on the `release` environment, which requires a manual
  # approval: every tag builds and tests on its own, nothing reaches a
  # registry until a person approves it. crates.io authenticates with a
  # short-lived OIDC token (trusted publishing), so no crates.io token is
  # stored anywhere. The extension marketplaces have no equivalent for a
  # personal publisher: each takes a token stored as a secret on the
  # `release` environment, readable only by approved runs, and each step is
  # skipped until its secret exists.
  publish:
    name: publish to crates.io and the extension marketplaces
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal && rustup default ${{ env.RUST_VERSION }}

      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io

      # Publishes every crate in dependency order.
      - name: Publish crates
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The extension published is the exact file attached to the release.
      - name: Fetch the released extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release download "$TAG" --pattern '*.vsix' --dir dist

      # vsce reads the token from VSCE_PAT. Platform packages are named
      # grebe-<platform>-<version>.vsix, the universal one grebe-<version>.vsix.
      # The universal one goes second, on its own: it only serves platforms
      # without a package, and the platform packages must not wait on it.
      - name: Publish the platform packages to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --skip-duplicate --packagePath dist/grebe-[a-z]*-*.vsix

      - name: Publish the universal package to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --skip-duplicate --packagePath dist/grebe-[0-9]*.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          set -euo pipefail
          for f in dist/*.vsix; do npx --yes ovsx publish "$f" --pat "$OVSX_PAT"; done
